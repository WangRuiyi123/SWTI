let currentQ = 0;
let answers = [];

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById("qNum").innerText = `${currentQ + 1} / ${questions.length}`;
  document.getElementById("qText").innerText = q.q;
  let html = "";
  q.o.forEach((opt, i) => {
    html += `<div class="option" onclick="select('${opt.k}')">${opt.t}</div>`;
  });
  document.getElementById("optionsBox").innerHTML = html;
}

function select(k) {
  answers[currentQ] = k;
  setTimeout(nextQ, 200);
}

function startTest() {
  currentQ = 0;
  answers = [];
  showScreen("pageQuiz");
  renderQuestion();
}

function nextQ() {
  if (!answers[currentQ]) {
    alert("请选择一个选项哦");
    return;
  }
  currentQ++;
  if (currentQ >= questions.length) {
    showResult();
    return;
  }
  renderQuestion();
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function showResult() {
  const count = { A: 0, B: 0, C: 0, D: 0 };
  answers.forEach(k => count[k]++);
  let maxKey = "A";
  if (count.B > count[maxKey]) maxKey = "B";
  if (count.C > count[maxKey]) maxKey = "C";
  if (count.D > count[maxKey]) maxKey = "D";
  const res = resultData[maxKey];
  document.getElementById("resultName").innerText = res.name;
  document.getElementById("resultDesc").innerText = res.desc;
  showScreen("pageResult");
}

function restartTest() {
  showScreen("pageStart");
}
